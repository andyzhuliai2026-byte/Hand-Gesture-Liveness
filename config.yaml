# All thresholds and tunables live here (PROMPT.md 5.6). Source tags:
#   [brief] given by PROMPT.md   [synth] derived from synthetic data   [calib] to be calibrated on
#   the calib half in M4   [impl] implementation parameter   [dev-N] deviation recorded in PLAN.md
# Liveness thresholds are bound to the tracker section: change it and re-calibrate.

camera:
  width: 1280                  # [brief 2] requested capture width, px
  height: 720                  # [brief 2] requested capture height, px
  max_read_failures: 30        # [brief 2] consecutive read() failures before exiting
  fps_nominal: 30.0            # [impl] fps written into video.mp4; true timestamps live in frames.npz

tracker:
  model_path: models/hand_landmarker.task
  model_url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
  running_mode: VIDEO          # [brief 2] the only supported mode
  num_hands: 2                 # [brief 5.5] needed to detect a second hand in frame
  min_hand_detection_confidence: 0.5   # [impl] MediaPipe default
  min_hand_presence_confidence: 0.5    # [impl] MediaPipe default
  min_tracking_confidence: 0.5         # [impl] MediaPipe default

gesture:
  pip_extended_deg: 160        # [brief 4][dev-5][calib] finger extended needs 2D (lm_px) angle(MCP, PIP, DIP) > this, degrees ...
  pip3d_min_deg: 110           # [dev-5][calib] ... AND lm_world angle > this; real open palm 3D middle p5 136 deg, fist <= 115
  thumb_tip_ratio: 0.75        # [dev-5][calib] thumb extended iff |P4-P6| / palm_width > this; smoke FIST 0.14-0.53, THUMBS_UP 1.04-1.55, OPEN_PALM 1.08-1.18
  ok_tip_ratio: 0.3            # [brief 4][dev-5][calib] OK needs 2D |P4-P8| < this * 2D palm width; smoke OK 0.08-0.22 (3D gap 0.37-0.50)
  ext_pip_deg: [90, 170]       # [brief 5.1] extension degree e (index..pinky): 2D PIP angle 90 -> 0, 170 -> 1
  ext_pip3d_deg: [100, 140]    # [dev-5] 3D PIP angle 100 -> 0, 140 -> 1; e = min(e2d, e3d)
  ext_thumb_ratio: [0.4, 0.9]  # [dev-5] thumb e: thumb_tip_ratio 0.4 -> 0, 0.9 -> 1
  smooth_window_s: 0.2         # [brief 4] majority-vote window, seconds (UI and stable-hold only)

roi:
  size: 128                    # [brief 5.0] palm ROI side, px, native resolution
  sat_level: 250               # [brief 5.5] gray level counted as saturated

session:
  countdown_s: 1.0             # [brief 3.1]
  first_match_frames: 3        # [brief 5.1] first match = raw label == target on this many consecutive detected frames
  first_match_max_s: 4.0       # [brief 3.1] first match must start within t0 + this, else FAIL(TIMEOUT / WRONG_GESTURE, PLAN D14)
  challenge_timeout_s: 5.0     # [brief 3.1] stable hold must complete within t0 + this, else FAIL(TIMEOUT / WRONG_GESTURE)
  stable_hold_s: 0.5           # [brief 3.1] smooth label == target for this long -> HOLD
  stable_gap_tol_s: 0.1        # [brief 3.1] accumulated non-target / undetected time tolerated inside the stable hold
  hold_s: 1.5                  # [brief 3.1] HOLD always runs this long
  hold_match_min: 0.7          # [brief 3.1] hold_match_ratio below this -> INSUFFICIENT(HOLD_BROKEN) in score()
  result_s: 3.0                # [brief 3.1] RESULT page, then IDLE
  reveal_lookback_s: 0.5       # [brief 3.1] labels seen within this before the reveal are excluded from the draw
  reveal_e_tol: 0.5            # [brief 3.1] |e_i - e*_i| < this on every participating finger -> gesture excluded
  wrong_gesture_window_s: 1.0  # [brief 3.1]
  wrong_gesture_frac: 0.5      # [brief 3.1]
  roi_interval_s: 0.1          # [brief 5.0] one ROI block per >= this within [t0, HOLD end]
  roi_max_blocks: 70           # [brief 5.0] oldest dropped beyond this
  challenge_len: 1             # [brief 3.4] only 1 is supported; 2 (M4 optional) not implemented, see DESIGN.md 8

quality:
  min_palm_frac: 0.08          # [brief 5.5] pixel palm width / frame width
  roi_mean_min: 40             # [brief 5.5]
  roi_mean_max: 220            # [brief 5.5]
  sat_ratio_max: 0.10          # [brief 5.5]
  hand_score_min: 0.7          # [brief 5.5]
  qualified_ratio_min: 0.6     # [brief 5.5] over [t0, HOLD end]
  qualified_min_frames: 15     # [brief 5.5]
  two_hands_ratio_max: 0.2     # [brief 5.5] n_hands >= 2 frames / window frames

fusion:
  w_planarity: 0.65            # [brief 5.6]
  w_texture: 0.20              # [brief 5.6]
  w_nonrigid: 0.15             # [brief 5.6]
  planarity_floor: 0.4         # [brief 5.6][calib] M4: max value with FRR = 0 on calib, <= initial + 0.2
  texture_floor: 0.3           # [brief 5.6][calib]
  pass_total: 0.6              # [brief 5.6]

temporal:
  prerecorded_s: 0.3           # [brief 5.1] t_r = t_match - t0 below this -> FAIL(PRERECORDED)
  match_frames: 3              # [brief 5.1] t_match = first of this many consecutive detected frames == target; must equal session.first_match_frames
  window_s: 1.0                # [brief 5.1] W = [max(t0, t_match - this, last t_switch), t_match]
  max_gap_s: 0.15              # [brief 5.1] gap between adjacent detected frames in W above this -> INSUFFICIENT(HAND_LOST)
  f_delta: 0.5                 # [brief 5.1] finger i is in F iff |e_i(W first) - e_i(t_match)| >= this
  mid_band: [0.2, 0.8]         # [brief 5.1] (a) some i in F has e_i inside this band within W
  max_ext_rate: 41.0           # [dev-8][calib] (brief 5.1 default 15) (b) max_i |de_i| / dt within W, 1/s. e in [0,1] => rate <= 1/dt, so (b)
                               # cannot fire below ~41 fps (off at 30 fps). 15 failed 16/23 real smoke transitions (per-transition max p99 31.4,
                               # p100 31.7 /s); brief rule max(p99 x 1.3, p100) on the smoke p99 gives 40.9, rounded to 41. M4 re-derives on calib (lands near 1.3 x fps; PLAN dev-8)
  switch_jump: 1.0             # [brief 5.0] track switch = palm centre jump > this x pixel palm width

nonrigid:
  c: 0.010                     # [synth][calib] score = sigmoid((r - c) / s); synthetic rigid r p95 < c < wiggling r median
  s: 0.0015                    # [synth][calib]
  min_frames: 5                # [dev-7] fewer qualified HOLD frames -> score None -> INSUFFICIENT(LOW_QUALITY)

planarity:
  min_pair_dt_s: 0.3           # [brief 5.3] t_b - t_a of a qualified pair
  min_normal_deg: 12           # [brief 5.3][dev-6] pair angle >= this, measured as palm swing (Kabsch on world P0,P1,P5,P9,P13,P17)
  max_pairs: 10                # [brief 5.3] largest angles first, each frame used at most once [dev-6]
  min_pairs: 3                 # [brief 5.3] fewer qualified pairs -> INSUFFICIENT(NEED_ROTATION)
  tau_hard: 0.02               # [brief 5.3][calib] R below this -> FAIL(PLANAR); M4: calib real-hand R p5 >= 2 x tau_hard
  c: 0.04                      # [brief 5.3][calib] score = sigmoid((R - c) / s)
  s: 0.01                      # [brief 5.3][calib]
  ransac_thresh: 0.02          # [brief 5.3] inlier threshold x frame-a pixel palm width; rho is logged, never scored
  ransac_iters: 200            # [brief 5.3]
  ransac_seed: 0               # [impl] fixed seed so rho is reproducible offline

texture:
  band: [0.15, 0.45]           # [brief 5.4] annulus, cycles / px
  c: 100.0                     # [synth][calib] score = 1 - sigmoid((M - c) / s); synthetic skin M << c, 4 px grating M >> c
  s: 25.0                      # [synth][calib]
  min_blocks: 5                # [brief 5.4] fewer qualified ROI blocks -> INSUFFICIENT(LOW_QUALITY)
