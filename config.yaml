# All thresholds and tunables live here (PROMPT.md 5.6). Source tags:
#   [brief] given by PROMPT.md   [synth] derived from synthetic data   [calib] to be calibrated on
#   the calib half in M4   [impl] implementation parameter   [dev-N] deviation recorded in PLAN.md
# Liveness thresholds are bound to the tracker section: change it and re-calibrate.

camera:
  width: 1280                  # [brief 2] requested capture width, px
  height: 720                  # [brief 2] requested capture height, px
  max_read_failures: 30        # [brief 2] consecutive read() failures before exiting
  fps_nominal: 30.0            # [impl] fps written into video.mp4; true timestamps live in frames.npz

tracker:
  model_path: models/hand_landmarker.task
  model_url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
  running_mode: VIDEO          # [brief 2] the only supported mode
  num_hands: 2                 # [brief 5.5] needed to detect a second hand in frame
  min_hand_detection_confidence: 0.5   # [impl] MediaPipe default
  min_hand_presence_confidence: 0.5    # [impl] MediaPipe default
  min_tracking_confidence: 0.5         # [impl] MediaPipe default

gesture:
  pip_extended_deg: 160        # [brief 4][calib] finger extended iff angle(MCP, PIP, DIP) > this, degrees
  thumb_ratio: 1.3             # [brief 4][calib] thumb extended needs |P4-P0| / palm_width > this ...
  thumb_cross_cos: 0.3         # [dev-1][calib] ... AND cos(P4-P2, P17-P5) < this (thumb not folded across palm)
  ok_tip_ratio: 0.3            # [brief 4] OK needs |P4-P8| < this * palm_width
  ext_pip_deg: [90, 170]       # [brief 5.1] extension degree e (index..pinky): PIP angle 90 -> 0, 170 -> 1
  ext_thumb_ratio: [1.1, 1.5]  # [brief 5.1] thumb e: |P4-P0| / palm_width 1.1 -> 0, 1.5 -> 1
  smooth_window_s: 0.2         # [brief 4] majority-vote window, seconds (UI and stable-hold only)

roi:
  size: 128                    # [brief 5.0] palm ROI side, px, native resolution
  sat_level: 250               # [brief 5.5] gray level counted as saturated
